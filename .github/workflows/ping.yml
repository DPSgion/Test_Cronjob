name: Ping Aiven
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL Client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Ping DB
        run: psql "${{ secrets.DB_URL }}" -c "SELECT current_database(), inet_server_addr();"
